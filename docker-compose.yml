name: fraud-detection-platform

x-app: &app
  image: fraud-detection-platform-app:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://fraud:fraud@postgres:5432/fraud
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    MODEL_PATH: /app/artifacts/models/champion.joblib
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - model_artifacts:/app/artifacts
    - platform_data:/app/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  volume-init:
    image: fraud-detection-platform-app:latest
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/artifacts/mlflow /app/artifacts/models /app/data/raw /app/data/processed &&
        chown -R 10001:10001 /app/artifacts /app/data
    volumes:
      - model_artifacts:/app/artifacts
      - platform_data:/app/data
    restart: "no"

  mlflow:
    <<: *app
    build: .
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////app/artifacts/mlflow/mlflow.db
      --default-artifact-root /app/artifacts/mlflow
    ports:
      - "5000:5000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  bootstrap:
    <<: *app
    command: ["python", "-m", "scripts.bootstrap"]
    restart: "no"
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "apps.worker.main"]
    ports:
      - "9101:9101"
    depends_on:
      api:
        condition: service_healthy

  explainer:
    <<: *app
    command: ["python", "-m", "apps.worker.explainer"]
    ports:
      - "9102:9102"
    depends_on:
      api:
        condition: service_healthy

  drift-monitor:
    <<: *app
    command: ["python", "-m", "apps.worker.monitor"]
    depends_on:
      api:
        condition: service_healthy

  retraining-worker:
    <<: *app
    command: ["python", "-m", "pipelines.retraining.worker"]
    depends_on:
      api:
        condition: service_healthy

  simulator:
    <<: *app
    command: ["python", "-m", "apps.simulator.main"]
    depends_on:
      worker:
        condition: service_started

  dashboard:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "8501:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v2.7.2
    profiles: ["full"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  full-training:
    <<: *app
    profiles: ["full"]
    command: ["sh", "-c", "python -m pipelines.training.data --profile full && python -m pipelines.training.train"]
    restart: "no"
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  postgres_data:
  redpanda_data:
  platform_data:
  model_artifacts:
  prometheus_data:
  grafana_data:
