[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraud-detection-platform"
version = "0.1.0"
description = "Production-style real-time fraud detection portfolio platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ml = [
  "imbalanced-learn>=0.12,<1",
  "mlflow>=2.16,<3",
  "shap>=0.46,<1",
  "xgboost>=2.1,<4",
]
streaming = ["confluent-kafka>=2.5,<3"]
dashboard = ["plotly>=5.24,<7", "streamlit>=1.39,<2"]
dev = [
  "locust>=2.31,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]
[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "confluent_kafka.*",
  "imblearn.*",
  "joblib.*",
  "mlflow.*",
  "pandas.*",
  "scipy.*",
  "shap.*",
  "sklearn.*",
  "xgboost.*",
]
ignore_missing_imports = true
